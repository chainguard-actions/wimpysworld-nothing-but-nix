name: Test custom safe-haven values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare environment and install mocks
        run: |
          # Create a user-writable bin directory for mocks and add it to PATH first
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          # Install mock lsb_release so the action's Ubuntu check passes
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-lsb-release.sh" "$HOME/bin/lsb_release"
          chmod +x "$HOME/bin/lsb_release"

          # Install mock df so the action's space checks pass
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-df.sh" "$HOME/bin/df"
          chmod +x "$HOME/bin/df"

          # Install mock sudo to intercept privileged commands that fail without CAP_SYS_ADMIN
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-sudo.sh" "$HOME/bin/sudo"
          chmod +x "$HOME/bin/sudo"

          # Ensure /mnt exists and is writable (may not exist in Docker containers)
          mkdir -p /mnt 2>/dev/null || sudo mkdir -p /mnt 2>/dev/null || true
          chmod 1777 /mnt 2>/dev/null || sudo chmod 1777 /mnt 2>/dev/null || true

          echo "Mock commands installed in $HOME/bin"
      - name: Run Nothing but Nix with custom safe-haven values
        id: action
        uses: .
        with:
          hatchet-protocol: holster
          witness-carnage: 'false'
          root-safe-haven: '4096'
          mnt-safe-haven: '2048'
      - name: Assert /nix directory exists
        run: |
          echo "Checking /nix directory..."
          if [ ! -d /nix ]; then
            echo "FAIL: /nix directory was not created"
            exit 1
          fi
          echo "PASS: /nix directory exists"
      - name: Assert /nix/build directory exists
        run: |
          echo "Checking /nix/build directory..."
          if [ ! -d /nix/build ]; then
            echo "FAIL: /nix/build directory was not created"
            exit 1
          fi
          echo "PASS: /nix/build directory exists"
      - name: Assert TMPDIR is set on /mnt
        run: |
          echo "TMPDIR: $TMPDIR"
          if [ -z "$TMPDIR" ]; then
            echo "FAIL: TMPDIR is not set"
            exit 1
          fi
          if [[ "$TMPDIR" != /mnt/* ]]; then
            echo "FAIL: TMPDIR ($TMPDIR) is not under /mnt"
            exit 1
          fi
          echo "PASS: TMPDIR is set to $TMPDIR"
      - name: Assert holster_done marker exists
        run: |
          echo "Checking holster_done marker..."
          if [ ! -f "${HOME}/.expansion/holster_done" ]; then
            echo "FAIL: holster_done marker not found"
            exit 1
          fi
          echo "PASS: holster_done marker exists"
      - name: Assert /mnt still has some free space (safe-haven respected)
        run: |
          MNT_FREE=$(/bin/df -m --output=avail /mnt | tail -n 1 | tr -d ' ')
          echo "Free space on /mnt: ${MNT_FREE}MB"
          echo "mnt-safe-haven: 2048MB"
          if [ "$MNT_FREE" -lt 100 ]; then
            echo "FAIL: /mnt has almost no free space (${MNT_FREE}MB)"
            exit 1
          fi
          echo "PASS: /mnt has ${MNT_FREE}MB free"
      - name: Show disk space
        run: /bin/df -h
