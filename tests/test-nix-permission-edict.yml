name: Test nix-permission-edict grants user ownership of /nix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          hatchet-protocol: holster
          witness-carnage: 'true'
          nix-permission-edict: 'true'
          mnt-safe-haven: '1024'
      - name: Assert action ran (succeeded or failed gracefully due to container limitations)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded - verifying /nix mount..."
            if ! mountpoint -q /nix; then
              echo "FAIL: action succeeded but /nix is not mounted"
              exit 1
            fi
            echo "PASS: /nix is mounted"
            current_uid=$(id --user)
            current_gid=$(id --group)
            nix_uid=$(stat -c '%u' /nix)
            nix_gid=$(stat -c '%g' /nix)
            echo "Current user: uid=$current_uid gid=$current_gid"
            echo "/nix owner: uid=$nix_uid gid=$nix_gid"
            if [ "$nix_uid" != "$current_uid" ]; then
              echo "FAIL: /nix uid is $nix_uid, expected $current_uid"
              exit 1
            fi
            if [ "$nix_gid" != "$current_gid" ]; then
              echo "FAIL: /nix gid is $nix_gid, expected $current_gid"
              exit 1
            fi
            echo "PASS: /nix is owned by current user"
            if ! touch /nix/.test-write-access 2>/dev/null; then
              echo "FAIL: current user cannot write to /nix"
              exit 1
            fi
            rm -f /nix/.test-write-access
            echo "PASS: current user can write to /nix"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (disk/mount operations not available in Docker container)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
