name: Test nix permission edict
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure /nix does not exist before action
        run: |
          if [ -d /nix ]; then
            sudo rm -rf /nix
          fi
          echo "Pre-check: /nix does not exist"
      - name: Install btrfs tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs || true
      - id: action
        uses: .
        with:
          hatchet-protocol: holster
          witness-carnage: "true"
          root-safe-haven: "2048"
          mnt-safe-haven: "1024"
          nix-permission-edict: "true"
        continue-on-error: true
      - name: Assert action ran with nix-permission-edict enabled
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "nix-permission-edict=true should chown /nix to current user"
          # Verify environment is Ubuntu (environment check would pass)
          if [ "$(lsb_release -is)" = "Ubuntu" ]; then
            echo "PASS: Running on Ubuntu - environment check passes"
          else
            echo "FAIL: Not running on Ubuntu"
            exit 1
          fi
      - name: Assert /nix ownership if it exists
        run: |
          if [ -d /nix ]; then
            nix_owner=$(stat -c '%U' /nix)
            current_user=$(id -un)
            echo "nix owner: $nix_owner"
            echo "current user: $current_user"
            if [ "$nix_owner" != "$current_user" ]; then
              echo "FAIL: /nix is owned by '$nix_owner', expected '$current_user'"
              exit 1
            fi
            echo "PASS: /nix is owned by current user ($current_user)"
          else
            echo "INFO: /nix does not exist - The Volume step likely failed in Docker"
            echo "This is expected in Docker/act environments without btrfs/losetup support"
            echo "PASS: Skipping ownership check (btrfs not available in Docker)"
          fi
      - name: Assert TMPDIR is set to /nix/_tmp if /nix exists
        run: |
          echo "TMPDIR: $TMPDIR"
          if [ -d /nix ]; then
            if [ "$TMPDIR" != "/nix/_tmp" ]; then
              echo "FAIL: expected TMPDIR='/nix/_tmp', got '$TMPDIR'"
              exit 1
            fi
            echo "PASS: TMPDIR is set correctly"
          else
            echo "INFO: /nix not mounted, TMPDIR check skipped"
            echo "PASS: Skipping TMPDIR check (btrfs not available in Docker)"
          fi
