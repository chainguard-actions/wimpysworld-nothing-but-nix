name: Test holster protocol
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure /nix does not exist before action
        run: |
          if [ -d /nix ]; then
            sudo rm -rf /nix
          fi
          echo "Pre-check: /nix does not exist"
      - name: Install btrfs tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs || true
      - id: action
        uses: .
        with:
          hatchet-protocol: holster
          witness-carnage: "true"
          root-safe-haven: "2048"
          mnt-safe-haven: "1024"
          nix-permission-edict: "false"
        continue-on-error: true
      - name: Assert action ran (holster protocol - level 0)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "Holster protocol skips Setup and Local steps (level < 2)"
          echo "Holster protocol skips docker/snap/apt purge in expansion script"
          # Verify environment is Ubuntu (environment check would pass)
          if [ "$(lsb_release -is)" = "Ubuntu" ]; then
            echo "PASS: Running on Ubuntu - environment check passes"
          else
            echo "FAIL: Not running on Ubuntu"
            exit 1
          fi
          # Check if expansion dir was created (created in The Volume step)
          if [ -d "${HOME}/.expansion" ]; then
            echo "PASS: expansion directory exists"
            ls -la "${HOME}/.expansion/" || true
          else
            echo "INFO: expansion directory not found - The Volume step may have failed in Docker"
            echo "This is expected in Docker/act environments without btrfs/losetup support"
          fi
      - name: Assert /nix does not have docker/snap purge markers (holster is level 0)
        run: |
          echo "Verifying holster protocol does not run purge steps..."
          # With holster (level 0), the expansion script should not create docker_done/snap_done
          if [ -f "${HOME}/.expansion/docker_done" ]; then
            echo "FAIL: docker_done marker found but holster protocol should not purge docker"
            exit 1
          fi
          if [ -f "${HOME}/.expansion/snap_done" ]; then
            echo "FAIL: snap_done marker found but holster protocol should not purge snap"
            exit 1
          fi
          echo "PASS: No unexpected purge markers found for holster protocol"
