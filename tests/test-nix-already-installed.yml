name: Test refuses to run when /nix already exists
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Simulate a pre-existing Nix installation
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo mkdir -p /nix
          else
            mkdir -p /nix
          fi
          ls -ld /nix
      - id: action
        uses: .
        continue-on-error: true
        with:
          hatchet-protocol: holster
      - name: Assert the action failed and did not touch the system
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail when /nix already exists"
            exit 1
          fi
          if [ -f "${HOME}/.expansion/holster_done" ]; then
            echo "FAIL: volume creation should not have happened"
            exit 1
          fi
          if [ -f /tmp/expand_nix_volume.sh ]; then
            echo "FAIL: purge script should not have been written"
            exit 1
          fi
          echo "PASS"
