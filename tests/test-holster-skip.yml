name: Test holster protocol skips and workflow continues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no loop device support (container runner)
        run: |
          sudo rm -f /dev/loop-control 2>/dev/null || rm -f /dev/loop-control 2>/dev/null || true
          if [ -e /dev/loop-control ]; then
            echo "FAIL: could not remove /dev/loop-control"
            exit 1
          fi
      - id: action
        uses: .
        with:
          hatchet-protocol: holster
          root-safe-haven: '4096'
          mnt-safe-haven: '512'
      - name: Later step still runs
        id: later
        run: echo "ran=yes" >> "$GITHUB_OUTPUT"
      - name: Assert
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LATER: ${{ steps.later.outputs.ran }}
          ROOT_FREE: ${{ steps.action.outputs.root-free-bytes }}
          NIX_AVAIL: ${{ steps.action.outputs.nix-avail-bytes }}
        run: |
          echo "outcome: $OUTCOME later: $LATER root-free-bytes: '$ROOT_FREE' nix-avail-bytes: '$NIX_AVAIL'"
          if [ "$OUTCOME" != "success" ] || [ "$LATER" != "yes" ]; then
            echo "FAIL: action should succeed and workflow continue"
            exit 1
          fi
          if [ -n "$ROOT_FREE$NIX_AVAIL" ]; then
            echo "FAIL: expected empty outputs"
            exit 1
          fi
          if [ -d /nix ] || ls /mnt/disk*.img >/dev/null 2>&1; then
            echo "FAIL: no volume should have been created"
            exit 1
          fi
          echo "PASS"
