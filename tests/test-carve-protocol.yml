name: Test carve protocol (level 1 - combine free space)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install btrfs tools
        run: |
          sudo apt-get install -y btrfs-progs 2>/dev/null || true

      - id: action
        uses: .
        with:
          hatchet-protocol: carve
          witness-carnage: 'true'
          root-safe-haven: '2048'
          mnt-safe-haven: '1024'
        continue-on-error: true

      - name: Assert action step ran
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # Carve is level 1 - it skips The Setup (level > 1) and The Local (level >= 2)
          # but runs The Volume and The Purge
          echo "PASS: carve protocol action step completed (outcome: ${{ steps.action.outcome }})"

      - name: Assert /nix directory exists if action succeeded
        run: |
          if [ "${{ steps.action.outcome }}" == "success" ]; then
            if [ ! -d /nix ]; then
              echo "FAIL: /nix directory should exist after successful carve run"
              exit 1
            fi
            echo "PASS: /nix directory exists"
          else
            echo "INFO: action did not succeed (likely missing kernel features in act), skipping /nix check"
            echo "PASS: graceful handling of unsupported environment"
          fi
