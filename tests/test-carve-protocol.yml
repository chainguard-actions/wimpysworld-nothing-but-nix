name: Test carve protocol
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure /nix does not exist before action
        run: |
          if [ -d /nix ]; then
            sudo rm -rf /nix
          fi
          echo "Pre-check: /nix does not exist"
      - name: Install btrfs tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs || true
      - id: action
        uses: .
        with:
          hatchet-protocol: carve
          witness-carnage: "true"
          root-safe-haven: "2048"
          mnt-safe-haven: "1024"
          nix-permission-edict: "false"
        continue-on-error: true
      - name: Assert action ran (carve protocol - level 1)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "Carve protocol is level 1 - skips Setup and Local steps"
          echo "Carve protocol does NOT purge docker/snap/apt"
          # Verify environment is Ubuntu (environment check would pass)
          if [ "$(lsb_release -is)" = "Ubuntu" ]; then
            echo "PASS: Running on Ubuntu - environment check passes"
          else
            echo "FAIL: Not running on Ubuntu"
            exit 1
          fi
          # Check if expansion dir was created (created in The Volume step)
          if [ -d "${HOME}/.expansion" ]; then
            echo "PASS: expansion directory exists"
            ls -la "${HOME}/.expansion/" || true
          else
            echo "INFO: expansion directory not found - The Volume step may have failed in Docker"
            echo "This is expected in Docker/act environments without btrfs/losetup support"
          fi
      - name: Assert carve protocol does not run docker/snap purge (level 1 < 2)
        run: |
          echo "Verifying carve protocol does not run cleave/rampage steps..."
          # With carve (level 1), the expansion script should not create docker_done/snap_done
          if [ -f "${HOME}/.expansion/docker_done" ]; then
            echo "FAIL: docker_done marker found but carve protocol (level 1) should not purge docker"
            exit 1
          fi
          if [ -f "${HOME}/.expansion/snap_done" ]; then
            echo "FAIL: snap_done marker found but carve protocol (level 1) should not purge snap"
            exit 1
          fi
          if [ -f "${HOME}/.expansion/cleave_done" ]; then
            echo "FAIL: cleave_done marker found but carve protocol (level 1) should not cleave"
            exit 1
          fi
          echo "PASS: No unexpected purge markers found for carve protocol"
