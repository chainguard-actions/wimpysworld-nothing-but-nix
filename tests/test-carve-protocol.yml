name: Test carve protocol (combine free space from / and /mnt)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs lsb-release
          sudo modprobe loop || true

      - name: Pre-check - /nix must not exist
        run: |
          if [ -d /nix ]; then
            echo "FAIL: /nix already exists, cannot run test"
            exit 1
          fi
          echo "PASS: /nix does not exist yet"

      - id: action
        uses: .
        continue-on-error: true
        with:
          hatchet-protocol: carve
          witness-carnage: 'true'
          root-safe-haven: '2048'
          mnt-safe-haven: '1024'
          nix-permission-edict: 'false'

      - name: Show diagnostics
        run: |
          echo "=== Action outcome: ${{ steps.action.outcome }} ==="
          echo "=== Disk usage ==="
          df -h || true
          echo "=== Loop devices ==="
          sudo losetup -l || true
          echo "=== Expansion dir ==="
          ls -la "${HOME}/.expansion/" 2>/dev/null || echo "expansion dir missing"
          echo "=== Mount info for /nix ==="
          mountpoint /nix && echo "/nix is mounted" || echo "/nix is NOT mounted"
          echo "=== Expansion log ==="
          cat "${HOME}/.expansion/expansion.log" 2>/dev/null || echo "no log"

      - name: Check if /nix was successfully mounted
        id: nix-check
        run: |
          if mountpoint -q /nix 2>/dev/null; then
            echo "mounted=true" >> $GITHUB_OUTPUT
            echo "INFO: /nix is mounted, will run full assertions"
          else
            echo "mounted=false" >> $GITHUB_OUTPUT
            echo "INFO: /nix is not mounted - skipping volume-dependent assertions"
          fi

      - name: Assert /nix has usable space
        run: |
          if [ "${{ steps.nix-check.outputs.mounted }}" != "true" ]; then
            echo "SKIP: /nix not mounted"
            exit 0
          fi
          nix_space=$(df -m --output=avail /nix | tail -n 1 | tr -d ' ')
          echo "Available space on /nix: ${nix_space}MB"
          if [ "${nix_space}" -lt 1024 ]; then
            echo "FAIL: /nix has less than 1024MB available (got ${nix_space}MB)"
            df -h
            exit 1
          fi
          echo "PASS: /nix has ${nix_space}MB available"

      - name: Assert carve completion markers exist
        run: |
          if [ "${{ steps.nix-check.outputs.mounted }}" != "true" ]; then
            echo "SKIP: /nix not mounted"
            exit 0
          fi
          echo "Checking expansion markers..."
          ls -la "${HOME}/.expansion/" || true

          if [ ! -f "${HOME}/.expansion/holster_done" ]; then
            echo "FAIL: holster_done marker not found"
            exit 1
          fi
          echo "PASS: holster_done marker exists"

          if [ ! -f "${HOME}/.expansion/carve_done" ]; then
            echo "FAIL: carve_done marker not found (expected for carve protocol)"
            cat "${HOME}/.expansion/expansion.log" 2>/dev/null || true
            exit 1
          fi
          echo "PASS: carve_done marker exists"

          if [ ! -f "${HOME}/.expansion/all_done" ]; then
            echo "FAIL: all_done marker not found"
            cat "${HOME}/.expansion/expansion.log" 2>/dev/null || true
            exit 1
          fi
          echo "PASS: all_done marker exists"

      - name: Assert TMPDIR is set to /nix/_tmp
        run: |
          if [ "${{ steps.nix-check.outputs.mounted }}" != "true" ]; then
            echo "SKIP: /nix not mounted"
            exit 0
          fi
          echo "TMPDIR: $TMPDIR"
          if [ "$TMPDIR" != "/nix/_tmp" ]; then
            echo "FAIL: expected TMPDIR=/nix/_tmp, got TMPDIR=$TMPDIR"
            exit 1
          fi
          echo "PASS: TMPDIR is set correctly"

      - name: Assert btrfs filesystem is present on /nix
        run: |
          if [ "${{ steps.nix-check.outputs.mounted }}" != "true" ]; then
            echo "SKIP: /nix not mounted"
            exit 0
          fi
          if ! sudo btrfs filesystem show /nix; then
            echo "FAIL: btrfs filesystem not found on /nix"
            exit 1
          fi
          echo "PASS: btrfs filesystem is present on /nix"

      - name: Show final disk usage
        run: |
          echo "Final disk usage:"
          df -h
