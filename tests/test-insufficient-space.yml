name: Test fails with insufficient space for the safe haven
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure /nix does not exist
        run: |
          if [ -d /nix ]; then
            echo "/nix unexpectedly present"; ls -ld /nix
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          hatchet-protocol: holster
          root-safe-haven: '999999999'
          mnt-safe-haven: '999999999'
      - name: Assert the action failed without creating a volume
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure due to impossible safe haven"
            exit 1
          fi
          if ls /mnt/disk*.img >/dev/null 2>&1; then
            echo "FAIL: no disk image should have been allocated"
            exit 1
          fi
          if [ -f "${HOME}/.expansion/holster_done" ]; then
            echo "FAIL: volume should not have been created"
            exit 1
          fi
          if [ -f /tmp/expand_nix_volume.sh ]; then
            echo "FAIL: purge should not have started"
            exit 1
          fi
          echo "PASS"
