name: Test hatchet protocol level mapping
on:
  workflow_dispatch:
jobs:
  test-holster-level:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install btrfs tools
        run: |
          sudo apt-get install -y btrfs-progs 2>/dev/null || true

      - id: action
        uses: .
        with:
          hatchet-protocol: holster
          witness-carnage: 'true'
        continue-on-error: true

      - name: Assert holster protocol action ran
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          echo "PASS: holster protocol action completed (outcome: ${{ steps.action.outcome }})"

      - name: Assert /nix exists if action succeeded
        run: |
          if [ "${{ steps.action.outcome }}" == "success" ]; then
            if [ ! -d /nix ]; then
              echo "FAIL: /nix directory should exist after successful holster run"
              exit 1
            fi
            echo "PASS: /nix directory exists after holster protocol"
          else
            echo "INFO: action did not succeed (likely missing kernel features in act)"
            echo "PASS: graceful handling of unsupported environment"
          fi

  test-cleave-level:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install btrfs tools
        run: |
          sudo apt-get install -y btrfs-progs 2>/dev/null || true

      - id: action
        uses: .
        with:
          hatchet-protocol: cleave
          witness-carnage: 'true'
        continue-on-error: true

      - name: Assert cleave protocol action ran
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          echo "PASS: cleave protocol action completed (outcome: ${{ steps.action.outcome }})"

      - name: Assert /nix exists if action succeeded
        run: |
          if [ "${{ steps.action.outcome }}" == "success" ]; then
            if [ ! -d /nix ]; then
              echo "FAIL: /nix directory should exist after successful cleave run"
              exit 1
            fi
            echo "PASS: /nix directory exists after cleave protocol"
          else
            echo "INFO: action did not succeed (likely missing kernel features in act)"
            echo "PASS: graceful handling of unsupported environment"
          fi

  test-default-level:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install btrfs tools
        run: |
          sudo apt-get install -y btrfs-progs 2>/dev/null || true

      - id: action
        uses: .
        with:
          hatchet-protocol: unknown-value
          witness-carnage: 'true'
        continue-on-error: true

      - name: Assert default protocol action ran
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          echo "PASS: unknown protocol (defaults to cleave) action completed (outcome: ${{ steps.action.outcome }})"

      - name: Assert /nix exists if action succeeded
        run: |
          if [ "${{ steps.action.outcome }}" == "success" ]; then
            if [ ! -d /nix ]; then
              echo "FAIL: /nix directory should exist after successful default (cleave) run"
              exit 1
            fi
            echo "PASS: /nix directory exists after default (cleave) protocol"
          else
            echo "INFO: action did not succeed (likely missing kernel features in act)"
            echo "PASS: graceful handling of unsupported environment"
          fi
