name: Test basic cleave protocol
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          hatchet-protocol: cleave
          witness-carnage: 'true'
          root-safe-haven: '2048'
          mnt-safe-haven: '1024'
      - name: Assert action ran (succeeded or failed gracefully due to container limitations)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded - verifying /nix mount..."
            if ! mountpoint -q /nix; then
              echo "FAIL: action succeeded but /nix is not mounted"
              exit 1
            fi
            echo "PASS: /nix is mounted"
            echo "Checking TMPDIR..."
            if [ "$TMPDIR" != "/nix/_temp" ]; then
              echo "FAIL: expected TMPDIR=/nix/_temp but got '$TMPDIR'"
              exit 1
            fi
            echo "PASS: TMPDIR is /nix/_temp"
            if [ ! -d /nix/_temp ]; then
              echo "FAIL: /nix/_temp directory does not exist"
              exit 1
            fi
            perms=$(stat -c '%a' /nix/_temp)
            echo "Permissions of /nix/_temp: $perms"
            if [ "$perms" != "1777" ]; then
              echo "FAIL: expected permissions 1777 but got '$perms'"
              exit 1
            fi
            echo "PASS: /nix/_temp exists with correct permissions"
            if [ ! -f "${HOME}/.expansion/holster_done" ]; then
              echo "FAIL: holster_done state file not found"
              exit 1
            fi
            echo "PASS: holster_done state file exists"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (disk/mount operations not available in Docker container)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
